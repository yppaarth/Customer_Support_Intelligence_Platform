services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resolveiq
      POSTGRES_PASSWORD: resolveiq
      POSTGRES_DB: resolveiq
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveiq"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    depends_on: [api, redis]
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
